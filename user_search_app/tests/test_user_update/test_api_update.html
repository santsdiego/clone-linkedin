                function addFormacao(){
                    let container_formacao = document.getElementById("container_formacao");
                    let formacao = document.getElementById("formacao");

                    if(formacao.value != ""){
                        let p = document.createElement("p");
                        let value = document.createTextNode(formacao.value);
                        let button_remove = document.createElement("button");
                        let text_button = document.createTextNode("x");
                        p.setAttribute("class", "bg-secondary bg-gradient px-2 text-white item-formacao");
                        p.setAttribute("id", count_formacao);
                        p.appendChild(value);
                        button_remove.setAttribute("id", "btn-remove");
                        button_remove.setAttribute("type", "button");
                        button_remove.setAttribute("onclick", `removeItemFormacao(${count_formacao})`);
                        button_remove.appendChild(text_button);
                        p.appendChild(button_remove);
                        container_formacao.appendChild(p);

                        array_formacao.push(formacao.value);
                        formacao.value = "";
                        count_formacao ++;

                        //console.log(array_formacao);
                    }
                }

                function removeItemFormacao(id_element){
                    let formacao = document.getElementById(id_element).innerText
                    let tamanho_item_text = formacao.length

                    let formacaoF = formacao.substring(0, tamanho_item_text - 1);

                    let index = array_formacao.indexOf(formacaoF.trim())
                    array_formacao.splice(index, 1);

                    let item = document.getElementById(id_element);
                    document.getElementById("container_formacao").removeChild(item);

                    //console.log(array_formacao);
                }

                async function updateUser(){
                    let idUser = document.getElementById("inp-id").value;
                    let nome = document.getElementById("nome").value;
                    let email = document.getElementById("email").value;
                    let idade = document.getElementById("idade").value;
                    let telefone = document.getElementById("telefone").value;

                    if(nome == "" || nome.trim() === ""){
                        console.log("O campo NOME não pode ser vazio.");

                    } else if(email == '' || email.trim() === ""){
                        console.log("O campo EMAIL não pode ser vazio.");

                    } else if(idade == ""){
                        console.log("O campo IDADE não pode ser vazio.");

                    } else{
                        const url = `http://localhost:8000/usuarios/${idUser}/`;

                        try {
                            const connection = await fetch(url, {
                                method: "PUT",
                                headers: {
                                    "Content-Type": "application/json",
                                    //"accept": "application/json"
                                },
                                //credentials: "include",
                                body: JSON.stringify({
                                    nome: nome,
                                    email: email,
                                    idade: idade,
                                    telefone: telefone,
                                })
                            });

                            const data = await connection.json();
                            console.log(data);

                        } catch(error){
                            console.error("Erro na requisição: ", error);
                        }
                    }
